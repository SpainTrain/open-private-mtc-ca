# cloud-aws: AWS-backed implementations of the cloud-types traits -- the v1
# production backend (spec §9.3). Implements ObjectStore/ObjectLock over
# aws-sdk-s3 (ticket aws-backend) and ReplicatedKv over aws-sdk-dynamodb
# (ticket mtc-lf7), exercised exclusively against LocalStack (spec §1
# non-goals: no real AWS spend). CloudHSM lands in a later ticket
# (cloud-aws-cloudhsm) in this same crate, per the §9.3 crate layout.
[package]
name = "cloud-aws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AWS-backed cloud-types implementations (S3ObjectStore, S3ObjectLock, DynamoDbReplicatedKv) over aws-sdk-s3/aws-sdk-dynamodb, exercised against LocalStack (spec §9.3)"
publish = false

[features]
# Gates the LocalStack-backed integration tests in tests/ (spec §19.1): they
# need a real LocalStack container (`docker compose -f
# deploy/local/docker-compose.yml up -d --wait localstack`) and are excluded
# from a plain `cargo test -p cloud-aws` via each integration test target's
# `required-features` below. Ticket aws-backend's demo command is
# `cargo test -p cloud-aws --features integration`.
integration = []

[dependencies]
cloud-types = { path = "../cloud-types" }
# Matches cloud-types' / cloud-memory's existing pin.
async-trait = "0.1"
# AWS SDK S3 client. Version and feature set pinned to match
# crates/dev-replicator's existing pin exactly (rt-tokio + default-https-client,
# no default features) so Cargo resolves one shared version instead of two --
# avoiding a new duplicate-dependency-version entry. mtc-t92.3: the SDK's own
# `rustls` feature name is misleading -- it selects the *legacy* hyper-0.14 /
# rustls-0.21 client (`aws-smithy-runtime`'s `tls-rustls` feature), which pulls
# rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). `default-https-client`
# selects the modern hyper-1.x client backed by rustls + aws-lc-rs
# (`aws-smithy-http-client`'s `rustls-aws-lc` feature), which resolves
# rustls-webpki >=0.102 -- and happens to unify with the rustls stack
# `mtc-admin-api-client`'s `rustls` feature already pulls via reqwest, so this
# also removes a pre-existing rustls/rustls-webpki version duplicate.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# AWS SDK DynamoDB client (ticket mtc-lf7). Same pin as aws-sdk-s3 above and
# matching crates/dev-replicator's existing aws-sdk-dynamodb pin exactly, for
# the same one-resolved-version reason.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Runs the shared cloud-test-suite conformance suites (spec §9.7) against
# this backend from tests/, gated behind the `integration` feature (a live
# LocalStack container is required) -- mirrors crates/cloud-memory/Cargo.toml,
# which runs the same suites unconditionally against the pure-memory backend.
cloud-test-suite = { path = "../cloud-test-suite" }
# tests/object_lock_suite.rs injects a real clock (SystemClock), not
# FakeClock -- see the crate-level "Clock choice for the shared ObjectLock
# suite" docs in src/lib.rs.
clock = { path = "../clock" }

# LocalStack-backed conformance runs (ticket aws-backend Testing AC:
# "Integration ... LocalStack-backed tests behind --features integration").
# `required-features` keeps these out of a plain `cargo test -p cloud-aws`
# (see the `integration` feature above); autodiscovery still finds the files,
# these entries only layer `required-features` onto the discovered targets.
[[test]]
name = "object_store_suite"
path = "tests/object_store_suite.rs"
required-features = ["integration"]

[[test]]
name = "object_lock_suite"
path = "tests/object_lock_suite.rs"
required-features = ["integration"]

[[test]]
name = "replicated_kv_suite"
path = "tests/replicated_kv_suite.rs"
required-features = ["integration"]

[lints]
workspace = true
