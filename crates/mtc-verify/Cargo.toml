# Relying-party verification core (read-path epic, ticket read-verify-core).
#
# A minimal-dependency, embeddable verifier for spec §12.1 steps 4-6: leaf-hash
# reconstruction, inclusion-proof application, and CA checkpoint-signature
# verification (ECDSA P-256, spec §4/§14.1). It depends ONLY on the core `mtc`
# domain crate — no service, storage, or async runtime — so it can be linked
# into relying-party code (browsers, agents, CLIs) with a tiny footprint.
#
# All Merkle/proof/signature math lives in `mtc` (tree-primitives, proofs,
# signing); this crate only orchestrates the §12.1 flow and maps every failure
# to a typed reason for the §20.2 failure-breakdown telemetry.
[package]
name = "mtc-verify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Relying-party MTC verification core: leaf hash, inclusion-proof application, and ECDSA P-256 checkpoint-signature verification (spec §12.1 steps 4-6)"

[dependencies]
# The only dependency: the core MTC domain crate (tree hashing, inclusion
# proofs, checkpoints, signing). Path dependency within the workspace; `mtc`
# has no `[workspace.dependencies]` entry, so it is referenced by path.
mtc = { path = "../mtc" }
# Typed library error enum (rule `thiserror-for-libs-eyre-for-bins`).
thiserror = { workspace = true }

[dev-dependencies]
# Property tests (spec §19.2): proofs generated by `mtc` for real trees verify,
# and any single-bit mutation is rejected. Workspace-pinned.
proptest = { workspace = true }

[lints]
workspace = true
