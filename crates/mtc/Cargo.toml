# Core MTC domain library (core-mtc-library epic, ticket core-mtc-types).
#
# Clean-room Rust types for draft-ietf-plants-merkle-tree-certs concepts
# (spec §2), following the repo type patterns: newtypes (§22.1), phantom-typed
# IDs (§22.5), `thiserror` error enums (§22.6). Tree operations, wire-format
# serialization, and signing land in separate tickets — this crate is types
# only.
[package]
name = "mtc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core Merkle Tree Certificate domain newtypes and spec primitive types (clean-room, draft-ietf-plants-merkle-tree-certs)"
publish = false

[dependencies]
thiserror = { workspace = true }
# Crypto deps for the signature-scheme abstraction (ticket mtclib-signing).
# Not in [workspace.dependencies]: crypto is scoped to this crate for now and
# pinned here per the "extra deps pinned in-crate" convention. RustCrypto is the
# sanctioned ECDSA/P-256 dependency (spec §28); reimplementing curve primitives
# is out of scope. FIPS-posture-relevant crypto upgrades require an ADR
# (.claude/rules/fips-boundary-preserved).
p256 = { version = "0.13", features = ["pkcs8"] } # ECDSA P-256, SPKI, RFC 6979
zeroize = "1"                                     # scrub private-key bytes on drop
rand_core = { version = "0.6", features = ["getrandom"] } # OsRng for key generation

[dev-dependencies]
# Not in [workspace.dependencies]; pinned here for the compile-fail test
# harness only (spec §22.1 guarantee is proven by tests/compile_fail/).
trybuild = "1.0"

[lints]
workspace = true
