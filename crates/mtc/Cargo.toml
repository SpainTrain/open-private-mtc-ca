# Core MTC domain library (core-mtc-library epic, ticket core-mtc-types).
#
# Clean-room Rust types for draft-ietf-plants-merkle-tree-certs concepts
# (spec §2), following the repo type patterns: newtypes (§22.1), phantom-typed
# IDs (§22.5), `thiserror` error enums (§22.6). Tree operations, wire-format
# serialization, and signing land in separate tickets — this crate is types
# only.
[package]
name = "mtc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core Merkle Tree Certificate domain newtypes and spec primitive types (clean-room, draft-ietf-plants-merkle-tree-certs)"
publish = false

[dependencies]
thiserror = { workspace = true }
# Non-workspace dependency, pinned in-crate (ticket tree-primitives): the
# RustCrypto SHA-256 used by `Sha256Hasher` for the Merkle tree hash (spec §28
# "RustCrypto crates"; §22.7 tree-updater hash function). `default-features =
# false` keeps it `no_std`-friendly and drops the asm feature; we only need the
# pure-Rust `Digest` API. Listed in the ticket report for the merge reconcile.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Not in [workspace.dependencies]; pinned here for the compile-fail test
# harness only (spec §22.1 guarantee is proven by tests/compile_fail/).
trybuild = "1.0"
# Property-based tests (spec §19.2, §19.3 layer 1). Merkle-tree invariants
# (determinism, append stability, subtree-decomposition coverage/bound) and the
# wire codec (arbitrary bytes never panic the parser; round-trips hold).
# Workspace-pinned.
proptest = { workspace = true }

[lints]
workspace = true
