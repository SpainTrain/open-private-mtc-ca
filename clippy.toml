# clippy.toml — workspace-wide clippy behavior knobs (spec §22.12).
#
# Lint *levels* (pedantic/nursery/cargo groups, unwrap/expect denies,
# missing_docs, unsafe_code) live in the root Cargo.toml [workspace.lints.*]
# tables and are inherited by member crates via `[lints] workspace = true`.
# This file only tunes how individual lints behave. The deviation policy is
# documented in docs/lint-policy.md.

# The documented test-exemption pattern for the unwrap/expect bans:
# `clippy::unwrap_used` / `clippy::expect_used` do not fire inside `#[test]`
# functions or `#[cfg(test)]` modules, so tests unwrap freely while production
# code cannot. (Non-`#[test]` helpers in integration-test files still need a
# scoped `#[allow]` — see docs/lint-policy.md.)
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Note: `cargo-ignore-publish` is deliberately left at its default (false).
# Despite the name, `true` would force `clippy::cargo_common_metadata` to lint
# even `publish = false` crates; the default already skips them, which is what
# we want for internal, never-published crates (e.g. the workspace placeholder).

# Apply pedantic/nursery fixes even when they would change exported
# signatures. Pre-1.0 workspace: we want the strictest form of these lints
# now, not after the public API ossifies.
avoid-breaking-exported-api = false

# Rule no-systemtime-now-in-prod (§23.2, spec §22.11), seeded by the
# dev-fake-clock ticket: production code reads time only through the injected
# `Clock` trait from crates/clock. `clock::SystemClock` is the one sanctioned
# wrapper and carries the only production `#[allow(clippy::disallowed_methods)]`;
# test code that genuinely needs ambient time adds the same scoped allow with a
# justifying comment (clippy has no test-exemption knob for this lint). The
# lint is warn-by-default; `-D warnings` (spec §22.13) promotes it to a deny.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use the injected `Clock` trait (crates/clock) instead; `clock::SystemClock` is the one sanctioned wrapper — rule no-systemtime-now-in-prod, spec §22.11" },
    { path = "std::time::Instant::now", reason = "use the injected `Clock` trait (crates/clock) instead — rule no-systemtime-now-in-prod, spec §22.11" },
]
